services:
  backend:
    build:
      context: ./backend

    container_name: foodiek-backend-compose

    ports:
      - "3000:3000"

    env_file:
      - ./backend/.env.docker

    depends_on:
      - redis

  redis:
    image: redis:7-alpine

    container_name: foodiek-redis

    ports:
      - "6379:6379"

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/vite-project

    container_name: foodiek-frontend-compose

    ports:
      - "80:80"

    depends_on:
      - backend
